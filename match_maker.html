/* ===== 유저 추가 ===== */
async function addUser() {
  const userId = document.getElementById('username').value.trim();
  const rating = parseInt(document.getElementById('rating').value, 10);
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (!userId) { msg.textContent = '유저 이름을 입력하세요.'; return; }

  try {
    const res = await fetch(`${API_BASE}/users`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ userId, rating })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = `추가 성공: ${data.user.user_id} (점수 ${data.user.rating})`;
      document.getElementById('username').value = '';
      document.getElementById('rating').value = 0;
      await loadUsers();
    } else {
      msg.textContent = `실패: ${data.error || res.status}`;
    }
  } catch { msg.textContent = '서버 오류'; }
}

function bestSplit(players) {
  const n = players.length, pick = 5;
  let best = null;

  // ✅ 상극 검사 함수
  function isValidTeam(teamIndices) {
    for (let i = 0; i < teamIndices.length; i++) {
      const p1 = players[teamIndices[i]];
      if (!p1.disharmony) continue; // 상극 설정이 없으면 패스

      for (let j = 0; j < teamIndices.length; j++) {
        if (i === j) continue;
        const p2 = players[teamIndices[j]];
        
        // p1의 상극 대상이 같은 팀(p2)에 있다면 무효 처리! (서로 싸움)
        if (p1.disharmony === p2.id || p2.disharmony === p1.id) {
          return false; 
        }
      }
    }
    return true; // 아무 문제 없으면 합격
  }

  function dfs(start, chosen) {
    if (chosen.length === pick) {
      const set = new Set(chosen);
      let a=0,b=0, A=[], B=[];
      for (let i=0;i<n;i++){
        if (set.has(i)) { a+=players[i].rating; A.push(i); }
        else { b+=players[i].rating; B.push(i); }
      }

      // 🚨 상극(disharmony) 체크! A팀과 B팀 모두 문제 없어야 진행
      if (!isValidTeam(A) || !isValidTeam(B)) return;

      const diff = Math.abs(a - b);
      if (!best || diff < best.diff || (diff === best.diff && Math.random() < 0.5)) {
        best = { A, B, diff, sumA: a, sumB: b };
      }
      return;
    }
    for (let i=start;i<=n-(pick-chosen.length);i++){
      chosen.push(i); dfs(i+1, chosen); chosen.pop();
    }
  }
  dfs(0, []); return best;
}

  li.dataset.position_sub  = position_sub  || '';
  li.dataset.disharmony = disharmony || ''; // ✅ 추가

// 여기도 포지션과 상극 데이터를 모두 잃어버리지 않게 꽉 잡아서 전달!

// ✅ 최근(가장 마지막) 경기의 10명 참가자를 그대로 참가자 리스트에 채우기
async function loadLastMembers() {
  try {
    const res = await fetch(`${API_BASE}/results?limit=1`, { cache: 'no-store' });
    const arr = await res.json();
    if (!Array.isArray(arr) || arr.length === 0) {
      alert('최근 경기 기록이 없습니다.');
      return;
    }
    const r = arr[0];

    // 1) 결과에서 받은 이름/ID를 최대한 모두 확보
    const blue = [
      { id: r.blue1,  name: r.blue1_name  }, { id: r.blue2,  name: r.blue2_name  },
      { id: r.blue3,  name: r.blue3_name  }, { id: r.blue4,  name: r.blue4_name  },
      { id: r.blue5,  name: r.blue5_name  },
    ];
    const red = [
      { id: r.red1,   name: r.red1_name   }, { id: r.red2,   name: r.red2_name   },
      { id: r.red3,   name: r.red3_name   }, { id: r.red4,   name: r.red4_name   },
      { id: r.red5,   name: r.red5_name   },
    ];
    const ten = [...blue, ...red];

    // 2) 참가자 영역 초기화
    selList.innerHTML = '';

    const byName = new Map(allUsersData.map(u => [String(u.user_id), u]));
    const byId   = new Map(allUsersData.map(u => [Number(u.id), u]));

    for (const p of ten) {
      const rawName = p?.name ?? '';
      const normName = String(rawName || '').trim();
      const rawId = Number(p?.id);

      let user = null;

      if (normName && byName.has(normName)) {
        user = byName.get(normName);
      } else if (Number.isFinite(rawId) && byId.has(rawId)) {
        user = byId.get(rawId);
      }

      const id     = user ? Number(user.id)      : (Number.isFinite(rawId) ? rawId : undefined);
      const name   = user ? String(user.user_id) : (normName || (Number.isFinite(rawId) ? `#${rawId}` : '미확인'));
      const rating = user ? Number(user.rating)  : 0;

      // 🚨 [수정된 부분] 이전 멤버를 불러올 때도 상극(disharmony) 데이터를 꼭 챙기도록 추가!
      addParticipant({
        id,
        name,
        rating,
        position_main: user?.position_main,
        position_sub: user?.position_sub,
        disharmony: user?.disharmony
      });
    }

    updateSelState();
  } catch (e) {
    console.error('loadLastMembers 실패:', e);
    alert('이전 멤버 불러오기 실패');
  }
}

function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function playOnce(id, {volume=1, rate=1} = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  el.pause(); el.currentTime = 0;
  el.volume = volume; el.playbackRate = rate;
  el.play().catch(()=>{});
}
function loopPlay(id, {volume=0.5, rate=1} = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  el.volume = volume; el.playbackRate = rate;
  el.loop = true;
  el.play().catch(()=>{});
}
function loopStop(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.pause(); el.currentTime = 0; el.loop = false;
}
// 선택된 10명 이름 풀에서 아무나 보여주기 (굴러가는 느낌)
function randomFromPool(pool) {
  if (!pool || pool.length === 0) return '...';
  return pool[(Math.random() * pool.length) | 0];
}

// best/players로부터 이름 배열을 뽑아 안전하게 구성
function resolveTeamNames(best, players) {
  const byId = new Map(players.map(p => [p.id, p.name || p.user_id || p.userId || String(p.id)]));
  const norm = (x) => (typeof x === 'object' && x !== null)
      ? (x.name || x.user_id || x.userId || String(x.id))
      : (byId.get(x) || String(x));
  const blueNames = (best.blue || []).map(norm).slice(0,5);
  const redNames  = (best.red  || []).map(norm).slice(0,5);
  return { blueNames, redNames };
}

        <span class="sum-pill sum-diff">점수 차이: <b id="sumDiff">0</b></span>

      ${Array.from({length:5}).map((_,i)=>`

// ✅ 1. 위아래 완벽하게 똑같은 양식을 출력하기 위한 통합 도우미 함수 (새로 추가)
function getSlotHtml(name, rating, posMain, posSub) {
  const posText = {
    'T': '🛡️ 탑', 'J': '🌳 정글', 'M': '🧙🏻‍♂️ 미드', 'A': '🏹 원딜', 'S': '🛠️ 서폿',
    '': '🤖 올라운더', null: '🤖 올라운더', 'NONE': '🚫 없음', undefined: '🤖 올라운더'
  };
  const mainStr = posText[posMain] || '🤖 올라운더';
  const subStr = posSub ? posText[posSub] : '';
  
  // 포지션 텍스트는 흰색(#ffffff), 구분선(·, |)은 회색(#777)
  const posHtml = `<span style="color:#ffffff; font-weight:normal;">${mainStr}</span>` + 
                  (subStr ? ` <span style="color:#777; margin:0 4px;">|</span> <span style="color:#ffffff; font-weight:normal;">${subStr}</span>` : '');
  
  return `${name} <small style="font-weight:400; color:#cbd5e1;">(${rating})</small> <span style="color:#777; margin:0 6px;">·</span> ${posHtml}`;
}

// ✅ 2. 메인 슬롯머신 공개 시퀀스 (기존 startSlotReveal 덮어쓰기)
async function startSlotReveal(best, players) {
  const blue = best.A.map(i => ({
    id: players[i].id, name: players[i].name, rating: players[i].rating ?? 0,
    position_main: players[i].position_main ?? '', position_sub: players[i].position_sub ?? ''
  }));

  const red  = best.B.map(i => ({
    id: players[i].id, name: players[i].name, rating: players[i].rating ?? 0,
    position_main: players[i].position_main ?? '', position_sub: players[i].position_sub ?? ''
  }));

  window.currentTeams = { blue, red };
  const pool = [...blue.map(x=>x.name), ...red.map(x=>x.name)];
  const resultBox = document.getElementById('result');
  const board = buildSlotBoard({ blueNames: blue.map(x=>x.name), redNames: red.map(x=>x.name) });
  resultBox.prepend(board);

  const elSumB = document.getElementById('sumBlue'); const elSumR = document.getElementById('sumRed'); const elDiff = document.getElementById('sumDiff');
  let sumB = 0, sumR = 0; const updateDiff = () => elDiff.textContent = Math.abs(sumB - sumR);

  loopPlay('sfxRoll', { volume: 0.45, rate: 1 });

  const spinOne = (el, finalObj, { baseSpin=1100, which='blue' }={}) => new Promise((resolve)=>{
    el.classList.add('spin');
    const label = el.querySelector('.slot-name');
    const int = setInterval(()=>{ label.textContent = randomFromPool(pool); }, 60);

    setTimeout(()=>{
      playOnce('sfxDecel', { volume: 0.6 });
      setTimeout(()=>{
        clearInterval(int);
        
        // 💡 통합 도우미 함수를 사용하여 슬롯 안에 직관적인 텍스트 노출!
        label.innerHTML = getSlotHtml(finalObj.name, finalObj.rating, finalObj.position_main, finalObj.position_sub);
        
        el.classList.remove('spin'); el.classList.add('final','highlight');
        if (which === 'red') el.classList.add('red');

        if (which === 'blue') { sumB += (finalObj.rating||0); elSumB.textContent = sumB; }
        else                 { sumR += (finalObj.rating||0); elSumR.textContent = sumR; }
        updateDiff(); playOnce('sfxTick'); setTimeout(()=> el.classList.remove('highlight'), 550); resolve();
      }, 500);
    }, baseSpin);
  });

  const blueCol = document.getElementById('slotBlueCol'); const redCol  = document.getElementById('slotRedCol');
  for (let i = 0; i < 5; i++) {
    const blueSlot = blueCol.querySelector(`.slot[data-idx="${i}"]`); await spinOne(blueSlot, blue[i], { baseSpin: 900 + i * 220, which: 'blue' });
    const redSlot = redCol.querySelector(`.slot[data-idx="${i}"]`); await spinOne(redSlot, red[i], { baseSpin: 900 + i * 220, which: 'red' });
  }
  loopStop('sfxRoll'); playOnce('sfxFanfare', { volume: 0.8 });
  showRecommendedPositions(window.currentTeams);
}

/* ===== 결과 업로드 ===== */
async function submitResult(winner) {
  if (!window.currentTeams) return;
  const blue = window.currentTeams.blue;
  const red  = window.currentTeams.red;
  if (blue.length !== 5 || red.length !== 5) return;

  const sample = (arr) => arr.slice(0,2).map(p => p.name).join(', ');
  const confirmMsg =
    winner === 'blue'
      ? `BLUE팀 승리로 기록할까요?\n(BLUE팀: ${sample(blue)})`
      : `RED팀 승리로 기록할까요?\n(RED팀: ${sample(red)})`;
  if (!confirm(confirmMsg)) return;

  const payload = { blue: blue.map(p => p.id), red: red.map(p => p.id), winner };
  try {
    const res = await fetch(`${API_BASE}/results`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    if (res.ok) {
      alert('결과가 기록되었습니다.');
      selList.innerHTML = ''; updateSelState();
      document.getElementById('result').innerHTML = '';
      loadUsers();
    } else {
      const data = await res.json().catch(()=> ({}));
      alert(`기록 실패: ${data.error || res.status}`);
    }
  } catch { alert('서버 오류'); }
}

// 📢 디스코드 채널로 5:5 팀 분배 결과 전송 (NONE -> 없음 처리 완벽 대응)
// 📢 디스코드 채널로 5:5 팀 분배 결과 전송 (올라운더 vs 부 포지션 없음 완벽 분리)
async function sendTeamToDiscord(best) {
  if (!window.currentTeams || !window.currentTeams.blue || !window.currentTeams.red) {
    alert('먼저 팀을 섞어주세요.');
    return;
  }

  const btn = document.getElementById('btnSendDiscord');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중...'; }

  const posMap = { 'T': '🛡️탑', 'J': '🌳정글', 'M': '🧙🏻‍♂️미드', 'A': '🏹원딜', 'S': '🛠️서폿' };
  const formatPos = (main, sub) => {
    const m = posMap[main] || '🤖올라운더';
    let s = '🤖올라운더';
    if (sub === 'NONE') {
      s = '부 포지션 없음';
    } else if (sub && posMap[sub]) {
      s = posMap[sub];
    }
    return `${m}/${s}`;
  };

  const payload = {
    type: 'team',
    modeTitle: '실력별 팀 분배',
    sumBlue: best.sumA,
    sumRed: best.sumB,
    diff: best.diff,
    blue: window.currentTeams.blue.map(p => ({
      name: p.name,
      rating: p.rating,
      pos: formatPos(p.position_main, p.position_sub)
    })),
    red: window.currentTeams.red.map(p => ({
      name: p.name,
      rating: p.rating,
      pos: formatPos(p.position_main, p.position_sub)
    }))
  };

  try {
    const res = await fetch(`${API_BASE}/discord/notify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      alert('🎉 디스코드 채널로 팀 명단 카드를 전송했습니다!');
    } else {
      alert(`전송 실패: ${data.error || res.status}`);
    }
  } catch (e) {
    alert(`네트워크 오류: ${e.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📢 디스코드로 팀 전송'; }
  }
}
