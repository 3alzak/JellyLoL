<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>젤리🐛의 내전 도우미 · 명장면</title>
     <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐛</text></svg>">



<style>
    /* 기존 index.html 스타일 상속 */
    :root{ --bg:#f4f4f9; --card:#fff; --edge:#e5e7eb; --text:#0f172a; --sub:#64748b; --blue:#2563eb; }
    
    /* ===== j-lol mini nav (prefix: jl-) ===== */
    .jl-mini-nav{
      max-width: 1100px; margin: 8px auto 18px;
      display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    }
    .jl-mini-card{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px; border-radius:12px;
      background:#0f172a; color:#e5e7eb; text-decoration:none;
      border:1px solid #1f2937; box-shadow:0 2px 10px rgba(0,0,0,.18);
      font-size:14px; line-height:1; transition:.12s transform,.12s border-color,.12s box-shadow;
    }
    .jl-mini-card:hover{ transform:translateY(-1px); border-color:#334155; }
    .jl-mini-card.is-active{
      border-color:#60a5fa; box-shadow:0 0 0 2px rgba(96,165,250,.25) inset, 0 2px 10px rgba(0,0,0,.2);
    }
    .jl-mini-badge{ font-size:11px; padding:2px 6px; border-radius:999px; margin-left:4px; background:#1f2937; color:#cbd5e1; }
    
    @media (prefers-color-scheme: light){
      .jl-mini-card{ background:#ffffff; color:#0f172a; border-color:#e5e7eb; }
      .jl-mini-card.is-active{ border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.2) inset; }
      .jl-mini-badge{ background:#eef2ff; color:#1e40af; }
    }

    body { font-family: Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; }
    h1 { color:#0056b3; margin:0 0 8px; text-align:center; }
    .sub { color:var(--sub); font-size:12px; margin:6px 0 18px; text-align:center; }

    /* 비디오 그리드 */
    .grid {
      display:grid; gap:20px; max-width:1100px; margin:0 auto;
      grid-template-columns: repeat( auto-fit, minmax(320px, 1fr) );
    }
    .video-card {
      background:var(--card); border:1px solid var(--edge); border-radius:12px;
      overflow:hidden; display:flex; flex-direction:column;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      height: 100%; /* 카드 높이 균일하게 */
    }
    .video-wrapper {
      width: 100%; aspect-ratio: 16/9; background: #000; position: relative;
    }
    video { width:100%; height:100%; object-fit:contain; }
    
    .info { 
      padding:14px; 
      display: flex; flex-direction: column; flex: 1; 
    }
    .title { font-weight:bold; font-size:16px; margin-bottom:6px; color:#1e293b; display:flex; justify-content:space-between; align-items:center;}
    
    /* 설명글: 2줄까지만 표시 (높이 균형 유지용) */
    .desc { 
      font-size:13px; color:#64748b; line-height:1.4; 
      margin-bottom: 12px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    
    /* [수정] 하단 메타 정보 */
    .meta { 
      margin-top: auto;
      display:flex; justify-content:space-between; align-items:center; 
      padding-top:10px; border-top:1px solid #f1f5f9; 
      gap: 10px; /* 날짜와 이름 사이 최소 간격 */
    }
    
    .date { 
      font-size:11px; color:#94a3b8; 
      white-space: nowrap; /* 날짜 줄바꿈 방지 */
      flex-shrink: 0;      /* 날짜가 찌그러지지 않게 고정 */
    }
    
    .uploader { 
      font-size:11px; color:#64748b; font-weight:bold; background:#f1f5f9; padding:2px 6px; border-radius:4px; 
      /* [중요 수정] 이름 생략(ellipsis) 및 길이 제한(max-width) 제거 */
      /* 이름이 길면 왼쪽 공간(중앙)으로 자연스럽게 침범함 */
      white-space: nowrap; 
    }

    .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:#eef2ff; color:#3b82f6; font-weight:bold; }
    .tag.new { background:#fee2e2; color:#ef4444; }
  </style>

  <script>
    // 현재 페이지 자동 하이라이트
    (function(){
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.addEventListener('DOMContentLoaded', () => {
         document.querySelectorAll('.jl-mini-nav .jl-mini-card').forEach(a=>{
          const href = (a.getAttribute('href')||'').toLowerCase();
          if (href && current.endsWith(href)) a.classList.add('is-active');
        });
      });
    })();
  </script>
</head>
<body>

  <h1>🎬 명예/치욕 의 전당</h1>
  <div class="sub">젤리 내전의 잊지 못할 순간들</div>

  <div id="nav-placeholder"></div>
  <script>
  fetch("nav.html")
    .then(res => res.text())
    .then(html => document.getElementById("nav-placeholder").innerHTML = html);
  </script>

  <div class="grid" id="videoGrid">
    <div style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">
      영상을 불러오는 중입니다...
    </div>
  </div>

<script>
  // API 설정
  const API_BASE = 'https://wispy-recipe-b8f5.3alzak.workers.dev/api';

  // 날짜 차이 계산 함수 (New 태그용)
  function isRecent(dateStr) {
    const videoDate = new Date(dateStr);
    const now = new Date();
    const diffTime = Math.abs(now - videoDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
    return diffDays <= 10; // 10일 이내면 true
  }

  // 날짜 포맷 (YYYY.MM.DD)
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  // 영상 목록 로드
  async function loadVideos() {
    const grid = document.getElementById('videoGrid');
    
    try {
      const res = await fetch(`${API_BASE}/videos`);
      
      if (!res.ok) throw new Error('불러오기 실패');
      
      const videos = await res.json();
      
      if (!Array.isArray(videos) || videos.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">아직 등록된 명장면이 없습니다.</div>';
        return;
      }

      grid.innerHTML = ''; // 로딩 메시지 제거

      videos.forEach(clip => {
        // New 태그 여부
        const isNew = isRecent(clip.created_at);
        const newTag = isNew ? '<span class="tag new">N</span>' : '';
        
        // 날짜 변환
        const dateStr = formatDate(clip.created_at);
        
        // 업로더 (없으면 익명)
        const uploader = clip.uploader_name ? `By ${clip.uploader_name}` : '';

        const html = `
          <div class="video-card">
            <div class="video-wrapper">
              <video controls preload="metadata" playsinline>
                <source src="videos/${clip.filename}" type="video/mp4">
                <source src="videos/${clip.filename}" type="video/webm">
                브라우저가 비디오를 지원하지 않습니다.
              </video>
            </div>
            <div class="info">
              <div class="title">
                ${clip.title}
                ${newTag}
              </div>
              <div class="desc">${clip.description || ''}</div>
              <div class="meta">
                <span class="date">${dateStr}</span>
                ${uploader ? `<span class="uploader">${uploader}</span>` : ''}
              </div>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', html);
      });

    } catch (e) {
      console.error(e);
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#ef4444;">영상 목록을 불러오지 못했습니다.</div>';
    }
  }

  // 실행
  loadVideos();

</script>
</body>
</html>
